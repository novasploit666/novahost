name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile Python package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile package
        run: python -m compileall -q novahost
